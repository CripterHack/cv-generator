version: '3.8'
services:
  backend:
    build: 
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - cv-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./web/frontend:/app
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - cv-network

  redis:
    build:
      context: .
      dockerfile: docker/redis.Dockerfile
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge

volumes:
  redis_data:
