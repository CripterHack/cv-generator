[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "cv-generator"
version = "0.1.0"
description = "A Python application to generate CVs"
requires-python = ">=3.11.5"
dependencies = [
    "Pillow>=9.5.0",
    "Jinja2>=3.1.2",
    "pdfkit>=1.0.0",
    "markdown2>=2.4.8",
    "reportlab>=3.6.12"
] 