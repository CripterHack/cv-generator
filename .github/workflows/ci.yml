name: CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r web/backend/requirements.txt

      - name: Run backend tests
        run: pytest tests/ web/backend/tests/ --cov=web/backend --cov=shared --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./web/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./web/frontend
        run: npm run test:ci

      - name: Run type check
        working-directory: ./web/frontend
        run: npm run type-check

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python linting tools
        run: pip install black flake8

      - name: Run Python linting
        run: |
          black --check --target-version py311 web/backend shared
          flake8 web/backend shared

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install Node.js dependencies
        working-directory: ./web/frontend
        run: npm ci

      - name: Run TypeScript linting
        working-directory: ./web/frontend
        run: npx eslint "src/**/*.{ts,tsx}"

  docker-build:
    needs: [backend-tests, frontend-tests, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t cv-generator-backend -f docker/backend.Dockerfile .

      - name: Build frontend image
        run: docker build -t cv-generator-frontend -f docker/frontend.Dockerfile .

  build-executables:
    needs: [backend-tests, frontend-tests, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: CVGenerator-windows
          - os: ubuntu-latest
            platform: linux
            artifact: CVGenerator-linux
          - os: macos-latest
            platform: macos
            artifact: CVGenerator-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb wkhtmltopdf || true

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install wkhtmltopdf || true

      - name: Build executable
        run: python scripts/build.py

      - name: Verify executable exists (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path ".\dist\CVGenerator.exe") {
            $size = (Get-Item ".\dist\CVGenerator.exe").Length / 1MB
            Write-Output "Executable OK: $([math]::Round($size, 1)) MB"
          } else {
            Write-Error "Executable not found"
            exit 1
          }

      - name: Verify executable exists (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          if [ -f "./dist/CVGenerator" ]; then
            ls -lh ./dist/CVGenerator
          else
            echo "Executable not found"
            exit 1
          fi

      - name: Package artifact (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force
          Copy-Item -Path ".\dist\CVGenerator.exe" -Destination ".\release\"
          if (Test-Path ".\shared\templates\cv_template.html") {
            Copy-Item -Path ".\shared\templates\cv_template.html" -Destination ".\release\"
          }

      - name: Package artifact (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p release
          cp dist/CVGenerator release/ || true
          cp -r dist/CVGenerator.app release/ || true
          cp shared/templates/cv_template.html release/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/
          retention-days: 30

  release:
    needs: build-executables
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release archives
        run: |
          mkdir -p release-archives
          cd artifacts

          if [ -d "CVGenerator-windows" ]; then
            cd CVGenerator-windows
            zip -r ../../release-archives/CVGenerator-windows.zip .
            cd ..
          fi

          if [ -d "CVGenerator-linux" ]; then
            cd CVGenerator-linux
            tar -czf ../../release-archives/CVGenerator-linux.tar.gz .
            cd ..
          fi

          if [ -d "CVGenerator-macos" ]; then
            cd CVGenerator-macos
            tar -czf ../../release-archives/CVGenerator-macos.tar.gz .
            cd ..
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-archives/*
          generate_release_notes: true
          draft: false
          prerelease: false
