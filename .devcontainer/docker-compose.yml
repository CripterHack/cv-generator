services:
  redis:
    image: redis:7.2-alpine
    container_name: cv_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cv-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass RedisPassword123!
    environment:
      - REDIS_PASSWORD=RedisPassword123!
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "RedisPassword123!", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cv-network:
    name: cv-network
    driver: bridge

volumes:
  redis_data:
    name: cv_redis_data
